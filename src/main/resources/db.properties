# Database Configuration Properties
# Choose database type: 'mysql' or 'h2'
db.type=h2

# H2 Database Settings (Embedded zero-config mode)
h2.driver=org.h2.Driver
h2.url=jdbc:h2:mem:healthcaredb;DB_CLOSE_DELAY=-1;MODE=MySQL
h2.user=sa
h2.password=

# MySQL Database Settings (For production / local MySQL server)
mysql.driver=com.mysql.cj.jdbc.Driver
mysql.url=jdbc:mysql://localhost:3306/healthcare_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
mysql.user=root
mysql.password=root123

# Connection Pool Settings
db.pool.min_idle=2
db.pool.max_idle=10
